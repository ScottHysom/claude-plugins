# Tests are a contributor tool, not part of any plugin. Nothing under plugins/
# imports pytest, and nothing a user installs through `/plugin marketplace add`
# ships it - the scripts stay standard-library-only so they run wherever the
# plugin lands.
#
# Discovery walks plugins/ so a new plugin that adds scripts/tests/ is picked
# up without editing this file. Each such directory puts its own script
# directory on sys.path from its own conftest.py.
#
# The repo's own tooling - the Claude Code hooks and the CI scripts - is listed
# by path, because pytest does not walk into directories whose names start with
# a dot.
#
# A test is named for the behaviour it checks, not the operation it performs -
# `it_<does x>` in a `Describe<Subject>` class. CLAUDE.md, under "Tests", says
# why. These two settings are what make that the form pytest collects.
#
# Both prefixes are listed while the suite is renamed onto the new form, so a
# file that has not been converted yet still runs. The old ones come off in the
# commit that finishes the rename, after which a leftover `test_` matches
# nothing and is silently not run - which is what the naming check in
# .github/workflows/validate.yml is there to catch.
[pytest]
testpaths = plugins .claude/hooks/tests .github/scripts/tests
addopts = --strict-markers --strict-config -ra
python_functions = it_* test_*
python_classes = Describe* Test*

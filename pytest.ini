# Tests are a contributor tool, not part of any plugin. Nothing under plugins/
# imports pytest, and nothing a user installs through `/plugin marketplace add`
# ships it - the scripts stay standard-library-only so they run wherever the
# plugin lands.
#
# README.md, under "Running the tests", says where each kind of script's suite
# goes and why; .github/scripts/check-tests.py placement fails a test file
# outside the roots below. A new plugin's suite needs no edit here. The hook and
# CI suites are listed by path because pytest does not walk into directories
# whose names start with a dot.
#
# Two things about tests/ that are load-bearing and easy to undo. There is no
# __init__.py anywhere under it: pytest then puts each test file's own directory
# on sys.path and names the module by its bare stem, which is what lets
# prose_samples resolve and what keeps two conftest.py files from colliding.
# Adding one would rename the modules to tests.prose-tuning.test_apply, which is
# not even a legal package name. And test module basenames are unique across the
# whole repo, not just within a plugin - two files named test_render.py in
# different directories collide with "import file mismatch".
#
# A test is named for the behavior it checks, not the operation it performs -
# `it_<does x>` in a `Describe<Subject>` class. CLAUDE.md, under "Tests", says
# why. These two settings are what make that the form pytest collects.
#
# These replace pytest's defaults rather than adding to them, so a test left as
# `def test_x` matches nothing: it is not run, and not reported either. The
# naming check in .github/scripts/check-tests.py is what notices - and it fails
# when it has scanned nothing, because the grep it replaced silently scanned
# nothing the moment its pathspec stopped matching.
[pytest]
testpaths = tests .claude/hooks/tests .github/scripts/tests
addopts = --strict-markers --strict-config -ra
python_functions = it_*
python_classes = Describe*

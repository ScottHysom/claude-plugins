name: issue-closed

# `flywheel.py claim` adds the claim label to an issue, and `release` takes
# the label off when a claim is given up. Most claims end another way: the pull
# request merges and GitHub closes the issue, and nothing in the script runs.
# Without this, every issue that was ever claimed keeps the label after it
# closes, and the label stops meaning someone is working on it. Closing
# through a merge counts as the person who merged, so this runs however the
# issue was closed. `flywheel.py stale` reports a closed issue that still has
# the label, in case a run fails or the issue closed before this workflow
# existed. The claim label is `claimed` unless .flywheel/labels.json
# gives another under `roles`, as `{"roles": {"claim": "flywheel-claim"}}`, so
# this reads the file from the closed issue's repository. The flywheel
# plugin's README.md, under "Claiming an issue", describes the claim.
#
# When the closed issue is the last open sub-issue of an approved plan issue,
# the second job closes the plan issue, as `flywheel.py plan close` does by
# hand. It fetches the script from the repository that ships the plugin,
# because a project's `.flywheel/` copy is ignored by git and so is not in the
# checkout, and the script reads the plan and approval labels from
# .flywheel/labels.json. Set `ref` on that checkout to hold it at one version.

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  clear-claim-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .flywheel
      - name: Remove the claim label
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          claim=claimed
          if [ -f .flywheel/labels.json ]; then
            claim=$(jq -r '.roles.claim // "claimed"' .flywheel/labels.json)
          fi
          if printf '%s' "$LABELS" | jq -e --arg claim "$claim" \
            'map(ascii_downcase) | index($claim | ascii_downcase) != null' > /dev/null; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$claim"
          fi

  close-finished-plan:
    # One pull request can close two issues of one plan, and each close
    # starts a run. The group runs them one at a time, so the second finds
    # the plan closed already. A run waiting in the group is canceled when a
    # third one queues, and `flywheel.py queue --plan N` still names a plan
    # that such a run left open. The claim label's job stays outside the
    # group, so it is never canceled to make way.
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-close-finished-plan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .flywheel
      - name: Fetch the flywheel plugin
        uses: actions/checkout@v4
        with:
          repository: ScottHysom/claude-plugins
          path: .flywheel-plugin
      - name: Close the plan the issue finished
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          FLYWHEEL: .flywheel-plugin/plugins/flywheel/scripts/flywheel.py
        run: python3 "$FLYWHEEL" plan close --sub-issue "$NUMBER"

# Formatter settings for every Python file in the repo. README.md, under
# "Formatting", says how it runs and what enforces it.

line-length = 100

# The floor prose.py and the plugin scripts promise. The formatter reads this to
# avoid writing syntax that only newer Pythons accept, such as parenthesised
# context managers.
target-version = "py39"

# Ruff also formats Python code blocks inside Markdown. The Markdown here is
# prose - skills, templates, references - and a code block in it is an example
# written for a reader, so leave it as written. This also keeps CI checking the
# same files the Claude Code hook formats.
extend-exclude = ["*.md"]

# Where the repo's own modules live, so import sorting groups `import prose` and
# `from conftest import ...` as first-party rather than as installed packages.
# Each tests/conftest.py puts these directories on sys.path at run time; ruff
# cannot see that, so it is told here.
src = ["plugins/*/scripts", "plugins/*/scripts/tests"]

[lint]
# Listed in full, not left to ruff's defaults, because the defaults change
# between releases just as formatting does.
select = [
    "F",  # pyflakes: undefined names, unused imports and variables
    "E4", "E7", "E9",  # pycodestyle errors the formatter cannot fix
    "W",  # pycodestyle warnings
    "B",  # bugbear: likely bugs, such as a mutable default argument
    "I",  # import order, which `ruff format` does not sort
    "UP",  # older syntax with a newer form, never newer than target-version
    "PT",  # pytest idioms
    "RUF",  # ruff's own, including noqa comments that suppress nothing
    "SIM115",  # a file opened outside `with`, left open until garbage collection
]
ignore = [
    # %-formatting is the house style throughout prose.py and its tests, and
    # works on 3.9. Converting to f-strings would be churn with nothing gained.
    "UP031",
    # Every prose.py command opens with `repo, config, scope = load(args)`, used
    # or not. Renaming the unused ones would make the commands differ for nothing.
    "RUF059",
]

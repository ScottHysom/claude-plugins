# Formatter and linter settings for every Python file in the repo. README.md,
# under "Formatting and linting", says how they run and what enforces them.

line-length = 100

# The floor prose.py and the plugin scripts promise. The formatter reads this to
# avoid writing syntax that only newer Pythons accept, such as parenthesized
# context managers.
target-version = "py39"

# Ruff also formats Python code blocks inside Markdown. The Markdown here is
# prose - skills, templates, references - and a code block in it is an example
# written for a reader, so leave it as written. This also keeps CI checking the
# same files the Claude Code hook formats.
extend-exclude = ["*.md"]

# Where the repo's own modules live, so import sorting groups `import prose` and
# a test helper such as `from prose_samples import ...` as first-party rather
# than as installed packages. Each tests/<plugin>/conftest.py puts these
# directories on sys.path at run time; ruff cannot see that, so it is told here.
# Both entries are needed: the first makes `import prose` first-party, the
# second does the same for a suite's own helper module.
src = ["plugins/*/scripts", "tests/*"]

[lint]
# Listed in full, not left to ruff's defaults, because the defaults change
# between releases just as formatting does.
select = [
    "F",  # pyflakes: undefined names, unused imports and variables
    "E4", "E7", "E9",  # pycodestyle errors the formatter cannot fix
    "W",  # pycodestyle warnings
    "B",  # bugbear: likely bugs, such as a mutable default argument
    "I",  # import order, which `ruff format` does not sort
    "UP",  # older syntax with a newer form, never newer than target-version
    "PT",  # pytest idioms
    "RUF",  # ruff's own, including noqa comments that suppress nothing
    "SIM115",  # a file opened outside `with`, left open until garbage collection
    "TID251",  # imports banned below
]
ignore = [
    # %-formatting is the house style throughout prose.py and its tests, and
    # works on 3.9. Converting to f-strings would be churn with nothing gained.
    "UP031",
    # Every prose.py command opens with `repo, config, scope = load(args)`, used
    # or not. Renaming the unused ones would make the commands differ for nothing.
    "RUF059",
]

[lint.flake8-tidy-imports.banned-api]
# Every plugin's tests have a conftest.py, and all of them are imported under
# the one module name. When a single pytest run loads more than one, `conftest`
# can resolve to another plugin's, and collection fails - but only for some
# orders of the files, so a plain `pytest` can pass while the bug is there.
# Hand tests a helper as a fixture, or import it from a module named after the
# plugin. README.md, under "Running the tests", says more.
"conftest".msg = "import a plugin-named helper module or use a fixture; README.md, Running the tests"

name: validate

# Every manifest in this repo is consumed by `/plugin marketplace add`. A broken
# manifest on main breaks installation for everyone, and nothing about it is
# visible from a diff. So validate on the way in. The same argument covers the
# plugin scripts, which rewrite the user's files in place, so their suite runs
# on the same trigger.
#
# Each job runs one gate of .github/scripts/gate.py, the command a contributor
# runs before pushing, so CI's list of checks and theirs cannot drift. The
# script's docstring lists what each gate runs, and README.md, under "Gates",
# says when to run which.

on:
  pull_request:
    # edited, so changing a pull request's description re-runs the checks
    # below that read it.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Read by the linked-issue check: issue labels, a pull request's commits, and
  # - under the contents: read above - the issue/N branch refs that claims make.
  issues: read
  pull-requests: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The required check. It runs `verify`: lint, the suite under coverage,
  # every check that reads only the clone, then the checks that read the base
  # branch and, on a pull request, the pull request itself.
  validate:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the coverage checks can find where a pull
      # request left its base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The floors in .github/coverage-floors.json are this version's
      # figures, and check-coverage.py's FLOORS_PYTHON names it too.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # pytest, ruff and shellcheck are contributor dependencies. The plugin
      # scripts themselves import nothing outside the standard library, and a
      # user installing a plugin never sees this.
      - name: Install the contributor tools
        run: pip install -r requirements-dev.txt

      # Tracks latest on purpose. A new validation rule should surface here as a
      # PR failure rather than as a user's failed install.
      - name: Install the Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # spec: ci-prints-cli-version
      - name: Report version
        run: claude --version

      # Each id below names a check `verify` runs. The token lets `trace` fail
      # an untraced entry whose issue has closed, and lets the pull request
      # checks read the issues it closes.
      # `verify` holds the traceability checks: `trace`, `surface`, `changes`,
      # the pull request description and the coverage floors. A rule CI
      # checks does not rest on an agent reading it, and a pull request whose
      # code and spec disagree does not merge. Source: the method's
      # `checks-over-instructions` and `no-merge-without-alignment`.
      # `verify` also runs flywheel's `fails-on-base`, which fails a test
      # the pull request adds that passes on the base branch's code, unless
      # the test says why. Beside it, a coverage floor only rises and the
      # untraced list only shrinks, so an agent cannot loosen a check to
      # pass. Source: the method's `agents-never-weaken-checks`.
      # spec: ci-runs-verify, ci-validates-manifests, ci-runs-manifest-check
      # spec: ci-runs-drift, ci-runs-descriptions, ci-runs-checklinkedissues
      # spec: ci-runs-description, ci-checks-python-formatting, ci-lints-python
      # spec: ci-lints-shell, ci-runs-suite-under-coverage, suite-runs-across-cores
      # spec: ci-runs-floors, ci-runs-diff, ci-runs-pragmas
      # spec: ci-runs-placement-and-naming, placement-cmd-fails-plugin-tests
      # spec: ci-runs-repeats, ci-runs-commands
      # spec: ci-runs-steps, ci-runs-steps-for-seams, ci-runs-fences
      # spec: ci-runs-trace, ci-runs-surface, ci-runs-changes
      # spec: ci-runs-fails-on-base
      - name: Verify
        env:
          BASE: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/gate.py verify ${BASE:+--base "origin/$BASE"}

  # The scripts have to run under whatever Python is already on the machine,
  # which on macOS is still 3.9. This runs `check` there, so a walrus or an
  # X | Y union fails here rather than on a user's machine. It is a job of its
  # own so each finishes when the other fails. `check` skips the floors here,
  # and says so, since they are 3.13's figures.
  check-on-3-9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install the contributor tools
        run: pip install -r requirements-dev.txt

      - name: Install the Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # spec: ci-runs-suite-under-coverage
      - name: Check
        run: python3 .github/scripts/gate.py check

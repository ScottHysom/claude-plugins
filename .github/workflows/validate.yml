name: validate

# Every manifest in this repo is consumed by `/plugin marketplace add`. A broken
# manifest on main breaks installation for everyone, and nothing about it is
# visible from a diff. So validate on the way in. The same argument covers the
# plugin scripts, which rewrite the user's files in place: `test` runs their
# suite on the same trigger.

on:
  pull_request:
    # edited, so changing a pull request's description re-runs the linked-issue
    # check below.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Read by the linked-issue check: issue labels, a pull request's commits, and
  # - under the contents: read above - the issue/N branch refs that claims make.
  issues: read
  pull-requests: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tracks latest on purpose. A new validation rule should surface here as a
      # PR failure rather than as a user's failed install.
      - name: Install the Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report version
        run: claude --version

      # --strict fails on warnings as well as errors. Without it, a SKILL.md with
      # no frontmatter at all passes: Claude Code loads it, but with no
      # description to decide when to use the skill. Validating a plugin
      # directory also checks the skills inside it.
      - name: Validate the marketplace manifest
        run: claude plugin validate --strict .

      - name: Validate every plugin manifest
        run: |
          rc=0
          found=0
          for dir in plugins/*/; do
            [ -f "${dir}.claude-plugin/plugin.json" ] || continue
            found=1
            echo "::group::${dir}"
            claude plugin validate --strict "$dir" || rc=1
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No plugin manifests found under plugins/. Expected at least one." >&2
            exit 1
          fi
          exit $rc

      # `claude plugin validate` checks each manifest alone, so it cannot see two
      # manifests disagreeing with each other. This catches that.
      - name: Check manifests agree with each other
        run: python3 .github/scripts/check-manifest-consistency.py check

      # Cowork's .plugin upload rejects a skill whose description holds anything
      # that looks like an XML tag. A marketplace install accepts it, and so does
      # `validate --strict` above, so without this the first sign is a failed
      # upload. COWORK.md, under "How skills load", records the difference.
      - name: Check skill descriptions pass Cowork's upload
        run: python3 .github/scripts/check-skills.py descriptions

      # A pull request may close only issues Scott has labeled approved, and
      # only from the issue/N branch that claiming the issue makes. Agents post
      # as Scott, so GitHub cannot tell their work apart; this job is required,
      # so the rules hold whichever surface an agent ran on. README.md, under
      # "Issues", describes the process.
      - name: Check linked issues are approved and claimed
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check-linked-issues.py

  # Kept separate from `validate` so it starts immediately rather than queueing
  # behind the Claude Code install, and so a red X says which kind of thing
  # broke. The matrix is the enforcement of prose.py's stated 3.9 floor: a
  # walrus or a X | Y union drifting in fails here rather than on the machine of
  # whoever is still on the system Python.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # pytest is a contributor dependency. The plugin scripts themselves import
      # nothing outside the standard library, and a user installing a plugin
      # never sees this.
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Formatting and lint are checked here rather than trusted to editors and
      # the Claude Code hook, which only run where someone set them up. Ruff's
      # results depend on ruff.toml's target-version, not on the Python running
      # it, so both legs agree.
      - name: Check formatting
        run: ruff format --check --diff .

      - name: Lint
        run: ruff check --output-format=github .

      # Shell has no compiler to complain, and its common bugs - an unquoted
      # variable that splits a path with a space in it, bash-only syntax under
      # #!/bin/sh - work on the machine that wrote them. `sh -n` checks each
      # script parses; shellcheck catches the rest. A plugin's shell templates
      # are copied into every project it sets up, so a bug there reaches all of
      # them.
      - name: Lint shell scripts
        run: |
          git ls-files -z '*.sh' | xargs -0 -r -n1 sh -n
          git ls-files -z '*.sh' | xargs -0 -r shellcheck

      # prose.py parses a markup grammar and rewrites files in place. Its
      # round-trip property - insert then strip returns the file byte-identical
      # - is the only thing standing between a tagging pass and a mangled
      # document, so it runs on every push.
      - name: Run the test suite
        run: pytest

      # Everything under plugins/<name>/ is copied verbatim into every install,
      # and nothing in the manifest can hold a file back - so a test file left
      # beside a script ships to every user, and no diff says so. This is what
      # keeps the next suite from landing there.
      - name: Check tests stay out of plugins/
        run: python3 .github/scripts/check-tests.py placement

      # pytest.ini collects only it_* functions and Describe* classes, so a
      # test left on the old names is collected by nothing: it fails nothing
      # and the suite still passes. The script is what notices - and, unlike
      # the grep it replaced, it fails when it has scanned nothing rather than
      # passing. It runs in this job rather than in `validate` so the matrix
      # also proves the script itself runs on the 3.9 floor.
      - name: Check test naming
        run: python3 .github/scripts/check-tests.py naming

      # A step two of a plugin's skills share lives once in the plugin's
      # reference/, and each SKILL.md points to it. A copy pasted into a second
      # SKILL.md reads fine in either file and drifts the first time one is
      # edited. In #44 only review caught the copies. Like the naming check,
      # it fails when it has scanned nothing.
      - name: Check skills share steps rather than copy them
        run: python3 .github/scripts/check-skills.py repeats

      # A skill that names a subcommand or flag its script lacks reads fine,
      # and the model meets the usage error mid-run and does the step by hand.
      # This puts every script invocation in a skill's shell fences through
      # that script's own parser. It runs here so the 3.9 matrix loads each
      # plugin script too, and it fails when it has found nothing to resolve.
      - name: Check skills name commands their scripts have
        run: python3 .github/scripts/check-skills.py commands

      # A step with no command leaves its work to the model, and nothing shows
      # it did. Each step of a SKILL.md runs a command the check above
      # resolves, or says why it runs none in a no-command marker. Every run
      # lists the marked steps, and a step waiting on an issue for its command
      # warns with that issue's number. Like the checks above, it fails when
      # it has found no step at all.
      - name: Check each skill step runs a command or says why not
        run: python3 .github/scripts/check-skills.py steps

      # A shell fence holding grep, awk or python3 -c has the model compute by
      # hand what the plugin's script should, and two runs need not agree.
      # This allows only script invocations and the few setup lines listed in
      # the script, and needs every fence labeled so a shell block cannot pass
      # as quoted markup. Like the others, it fails when it has found nothing.
      - name: Check skills' shell fences run only their scripts
        run: python3 .github/scripts/check-skills.py fences

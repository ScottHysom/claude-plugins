name: loop-report

# Copied from the flywheel plugin's template,
# plugins/flywheel/templates/loop-report.yml, with the spec line below
# added. Change the template, then copy it here again.
#
# On the schedule below, `flywheel.py stale` names claims whose label and
# branch disagree, and `flywheel.py measure` reports the pull requests merged
# since the last run that succeeded: each one's spend, whether CI was green on its first run, the
# reviewer's findings and its lead time from approval to merge. Both results
# go into one open issue titled "Loop report", which the run opens the first
# time and updates after that. The usage records that spend is read from are
# on the machine that ran the sessions, so this report names spend as not
# computed. The flywheel plugin's README.md, under "Measuring the loop",
# describes the measures.
#
# The script comes from the repository that ships the plugin, at its default
# branch. Set `ref` on that checkout to hold it at one version.

on:
  schedule:
    # Mondays at 06:00 UTC. Set it to the schedule the project wants.
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the flywheel plugin
        uses: actions/checkout@v4
        with:
          repository: ScottHysom/claude-plugins
          path: .flywheel-plugin
      # spec: ci-runs-stale-and-measure-on-schedule
      - name: Record stale claims and the loop's measures in one issue
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          FLYWHEEL: .flywheel-plugin/plugins/flywheel/scripts/flywheel.py
          TITLE: Loop report
        run: |
          # The window opens on the day the last successful run started, so the
          # report covers the merges since that run on any schedule. measure
          # takes a date, so a pull request merged on that day before that run
          # is in both reports. A first run covers the last seven days.
          since=$(gh run list --workflow "$WORKFLOW" --status success --limit 1 \
            --json createdAt --jq '.[0].createdAt[:10] // empty')
          [ -n "$since" ] || since=$(date -u -d '7 days ago' +%Y-%m-%d)
          stale=0
          measure=0
          {
            printf '## Stale claims\n\n```text\n'
            python3 "$FLYWHEEL" stale 2>&1 || stale=$?
            printf '```\n\n## Measures since %s\n\n```text\n' "$since"
            python3 "$FLYWHEEL" measure --since "$since" 2>&1 || measure=$?
            printf '```\n'
          } > report.md
          number=$(gh issue list --state open --limit 1000 --json number,title \
            --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file report.md
          else
            gh issue create --title "$TITLE" --body-file report.md
          fi
          # stale exits 1 when it finds a stale claim, which the report shows.
          # Exit 2 means a command could not run.
          [ "$stale" -ne 2 ] && [ "$measure" -ne 2 ]
